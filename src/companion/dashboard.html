<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Wallpaper 管理器</title><link rel="stylesheet" href="/panel.css"><link rel="stylesheet" href="/dashboard.css"><script src="/panel-dom.js" defer></script><script src="/dashboard.js" defer></script></head><body>
<main><header class="manager-heading"><div><h1>Codex Wallpaper</h1><p>獨立桌布管理器</p></div><span data-host-status role="status" aria-live="polite">正在連線…</span></header>
<section class="host-card"><p data-host-version></p><strong data-error-code></strong><p data-error-message></p><div class="manager-actions"><button data-action="show-window">顯示管理器</button><button data-action="reconnect">重新偵測</button><button data-action="launch">開啟宿主</button><button data-action="wait-for-exit-and-launch">退出後自動接回</button><button data-action="set-enabled">啟用／停用</button><button data-action="export-diagnostics">匯出診斷</button><button data-action="exit">退出管理器</button></div><p data-notice aria-live="polite"></p></section>
<p class="manager-note" data-entry-state></p><p class="manager-note">視窗關閉後管理器仍留在系統匣。更新後不相容或無法連線時，會在此顯示原因。</p></main>
</body></html>
