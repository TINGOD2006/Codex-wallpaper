name: Windows validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use a canonical fixture directory
        shell: pwsh
        run: |
          $fixtureTemp = Join-Path $env:GITHUB_WORKSPACE '.state/ci-temp'
          New-Item -ItemType Directory -Path $fixtureTemp -Force | Out-Null
          "TEMP=$fixtureTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$fixtureTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: npm test
      - run: npm run build:companion
      - name: Native activation and startup fixtures
        shell: pwsh
        run: |
          foreach ($test in @('windows-entry-hint', 'windows-entry-feedback', 'windows-native-activation', 'windows-boot-visibility')) {
            & pwsh -NoProfile -File "test/$test.Tests.ps1"
            if ($LASTEXITCODE -ne 0) { throw "Failed: $test" }
          }
