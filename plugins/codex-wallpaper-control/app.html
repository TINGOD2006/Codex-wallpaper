<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark;font:14px/1.6 system-ui;background:var(--app-color-background-surface,Canvas);color:var(--app-color-text-foreground,CanvasText)}body{margin:0;padding:20px}main{max-width:760px;margin:auto}h1{font-size:21px;margin:0 0 8px}section{border:1px solid color-mix(in srgb,currentColor 20%,transparent);border-radius:12px;padding:16px;margin-top:16px}button{font:inherit;color:inherit;background:var(--app-color-background-elevated-primary,ButtonFace);border:1px solid color-mix(in srgb,currentColor 25%,transparent);border-radius:8px;padding:8px 12px;cursor:pointer}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.muted{opacity:.7}strong{display:block}#error{color:var(--app-color-text-warning,#bd7927)}@media(max-width:420px){body{padding:12px}button{flex:1 1 40%}}</style></head><body><main><h1>Codex Wallpaper</h1><p class="muted">獨立管理器與目前宿主的實際狀態</p><section><strong id="phase" role="status" aria-live="polite">正在連線…</strong><p id="version"></p><p id="error" role="alert"></p><nav><button data-tool="wallpaper_open_manager">開啟管理器</button><button data-tool="wallpaper_set_enabled">啟用／停用</button><button data-tool="wallpaper_reconnect">重新偵測</button></nav></section><p class="muted">完整桌布、六區材質與播放設定可在獨立管理器調整。介面更新不相容時，管理器會顯示原因。</p></main><!--PLUGIN_SCRIPT--></body></html>
